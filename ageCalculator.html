<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="icon" href="images/generate.png">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        .container{
            background: linear-gradient(135deg, #6c86da, #8b48b8);
            width: 100%;
            min-height: 100vh;
            padding: 10px;
            color: #fff;
        }

        .calculator{
            width: 100%;
            max-width: 600px;
            margin-left: 10%;
            margin-top: 10%;
        }

        .calculator h1{
            font-size: 60px;
        }

        .calculator h1 span{
            color: #483ed6;
        }

        .input-box{
            margin: 40px 0;
            padding: 35px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
        }

        .input-box input{
            flex: 1;
            margin-right: 20px;
            padding: 14px;
            border: 0;
            outline: 0;
            font-size: 18px;
            border-radius: 7px;
            position: relative;
        }

        .input-box button{
            background: #483ed6;
            border: 0;
            outline: 0;
            padding: 15px 30px;
            border-radius: 7px;
            font-weight: 500;
            color: #fff;
            cursor: pointer;
        }

        .input-box input::-webkit-calendar-picker-indicator{
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: auto;
            height: auto;
            position: absolute;
            background-position: calc(100% - 10px);
            background-size: 30px;
            cursor: pointer;

        }

        #result{
            font-size: 20px;

        }
        #result span{
            color: #003cff;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <div class="calculator">
            <h1>Javascript <br><span>Age Calculator</span></h1>
            <div class="input-box">
                <input type="date" id="date">
                <button>Calculate !</button>
            </div>
            <p id="result"></p>
        </div>

    </div>
    
    <script src="ageCalculator.js"></script>
</body>
</html>
